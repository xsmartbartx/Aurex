[project]
name = "aurex"
version = "0.1.0"
description = "AUREX — AI financial intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "numpy>=2.0",
    "anthropic>=0.40",
    "stripe>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "import-linter>=2.1",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "modules", "security", "pipelines", "interface"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
markers = ["eval: AI evaluation set and injection corpus (release gate)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["core", "modules", "security", "pipelines", "interface"]
omit = ["interface/terminal-web/*", "migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = false
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["interface/terminal-web", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101", "B008", "S311", "SIM108", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608"]
"interface/api/routes/*" = ["B006"]  # FastAPI query lists are declared with a literal default
"core/db.py" = ["S608"]  # role and table names are constants from the model metadata

[tool.importlinter]
root_packages = ["core", "modules", "security", "pipelines", "interface"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (ADR-0001, ADR-0002)"
type = "layers"
layers = [
    "interface",
    "pipelines",
    "security",
    "modules.intelligence",
    "modules.markets | modules.portfolio | modules.quant | modules.graph",
    "modules.datalab",
    "modules.analysis",
    "modules.integration | modules.processing",
    "modules.validation | modules.logging",
    "core",
]

[[tool.importlinter.contracts]]
name = "Only integration makes outbound network calls"
type = "forbidden"
allow_indirect_imports = true  # the rule is about who imports it directly
source_modules = [
    "core", "security", "pipelines", "interface",
    "modules.validation", "modules.logging", "modules.processing", "modules.analysis",
    "modules.datalab", "modules.markets", "modules.intelligence",
    "modules.portfolio", "modules.quant", "modules.graph",
]
forbidden_modules = ["httpx", "anthropic", "stripe", "requests", "smtplib", "socket"]

[[tool.importlinter.contracts]]
name = "The financial engine is pure: no storage, no network"
type = "forbidden"
allow_indirect_imports = true  # the rule is about who imports it directly
source_modules = ["modules.processing"]
forbidden_modules = ["sqlalchemy", "httpx", "psycopg"]

[[tool.importlinter.contracts]]
name = "Product modules reach shared data only through the datalab access interface"
type = "forbidden"
allow_indirect_imports = true  # the rule is about who imports it directly
source_modules = [
    "modules.markets", "modules.intelligence", "modules.portfolio",
    "modules.quant", "modules.graph", "modules.analysis",
]
forbidden_modules = ["modules.datalab.models", "modules.datalab.ingestion"]
